# /etc/nginx/sites-available/coach — VM Ubuntu de la Freebox (nginx + PHP-FPM 8.3), à côté de free-control (port 80).
# Sans nom de domaine ni certificat : port 8080 en HTTP, sur le réseau local seulement.
# Pour l'iPhone (installation, notifications), il faudra un nom de domaine en HTTPS : remplacer alors « listen 8080 ».
server {
    listen 8080;
    listen [::]:8080;
    root /srv/coach/public;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Fichiers cachés (.env, .git…) jamais servis.
    location ~ /\. { return 404; }

    # Le service worker et la coquille doivent toujours être revalidés.
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ { expires -1; try_files $uri =404; }

    location ~ ^/(css|js|icons|media)/ { expires 7d; try_files $uri =404; }

    # Tout le reste (API et écrans de l'app) passe par le routeur PHP.
    location / { try_files $uri /index.php$is_args$args; }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
