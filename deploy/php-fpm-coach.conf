; /etc/php/8.4/fpm/pool.d/coach.conf — pool dédié, petit (un seul utilisateur).
[coach]
user = coach
group = coach
listen = /run/php/php8.4-fpm-coach.sock
listen.owner = caddy
listen.group = caddy
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
php_admin_flag[expose_php] = off
